# =====================================================================
#  WatchTracker - configurazione del gruppo
#  Questo file è versionato su GitHub ed è letto all'avvio: sovrascrive
#  i valori di src/main/resources/application.properties.
#  Qui si cambiano chiave API e database senza toccare il resto.
# =====================================================================

# --- Chiave TMDB comune al gruppo (https://www.themoviedb.org/settings/api) ---
watchtracker.tmdb.api-key=3054eeacd950023b28fb1eb42e95a130

# --- Database ---
# Di default: H2 in memoria (nessuna installazione, i dati si perdono al riavvio).
spring.datasource.url=jdbc:h2:mem:watchtracker;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Per usare MySQL: commentare il blocco H2 qui sopra e togliere il commento alle righe seguenti.
# Il database "watchtracker" viene creato automaticamente se non esiste.
#spring.datasource.url=jdbc:mysql://localhost:3306/watchtracker?createDatabaseIfNotExist=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=
#spring.h2.console.enabled=false

# Gestione dello schema: "update" crea/aggiorna le tabelle dalle entità JPA.
spring.jpa.hibernate.ddl-auto=update
