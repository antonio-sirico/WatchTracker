spring.application.name=watchtracker
server.port=8080

# --- Database: valori di default (H2 in memoria). Per cambiare database modificare local.properties ---
spring.datasource.url=jdbc:h2:mem:watchtracker;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Console web del database: http://localhost:8080/h2  (JDBC URL: jdbc:h2:mem:watchtracker)
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# --- Cataloghi esterni ---
# La chiave TMDB del gruppo e le impostazioni del database stanno in webapp/local.properties,
# importato qui sotto: i suoi valori sovrascrivono quelli di questo file.
spring.config.import=optional:file:./local.properties
watchtracker.tmdb.api-key=${TMDB_API_KEY:chiaveapi}
watchtracker.tmdb.base-url=https://api.themoviedb.org/3
watchtracker.tmdb.image-base-url=https://image.tmdb.org/t/p/w342
watchtracker.jikan.base-url=https://api.jikan.moe/v4
