# Profilo MySQL: le entità JPA sono le stesse, cambia solo questa configurazione.
# Avvio:  mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Richiede un server MySQL in ascolto su localhost:3306; il database viene creato se non esiste.
spring.datasource.url=jdbc:mysql://localhost:3306/watchtracker?createDatabaseIfNotExist=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
